<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseBuilding - Praćenje Gradnje</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-300 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">HouseBuilding</h1>
        <p class="text-slate-500 text-sm mt-1">Pregled budžeta, faza, majstora i računa</p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <a href="/api/expenses/export/csv" class="bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs px-3.5 py-3 rounded-xl border border-slate-300 shadow-sm flex items-center gap-1.5 transition">
          📊 Izvezi u CSV
        </a>
        <div class="bg-white p-3 px-4 rounded-xl shadow-sm border border-slate-200 text-right min-w-[130px]">
          <span class="block text-xs uppercase font-semibold text-slate-400">Ukupan Budžet</span>
          <span id="stat-total-budget" class="text-lg font-bold text-slate-800">€0</span>
        </div>
        <div class="bg-white p-3 px-4 rounded-xl shadow-sm border border-slate-200 text-right min-w-[130px]">
          <span class="block text-xs uppercase font-semibold text-slate-400">Ukupno Utrošeno</span>
          <span id="stat-total-spent" class="text-lg font-bold text-emerald-600">€0</span>
        </div>
      </div>
    </header>

    <!-- Glavni sadržaj -->
    <main class="mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Lista faza gradnje -->
      <section class="lg:col-span-2 space-y-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xl font-bold text-slate-900">Faze Gradnje</h2>
          <span id="phase-count" class="text-xs font-semibold bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">0 faza</span>
        </div>
        <div id="phases-list" class="space-y-4">
          <div class="text-center py-8 text-slate-400">Učitavanje podataka...</div>
        </div>
      </section>

      <!-- Sidebar Forme -->
      <section class="space-y-6">
        
        <!-- Forma za unos troška sa priloženim računom i dobavljačem -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-900 mb-4">Evidentiraj Trošak</h2>
          
          <form id="expense-form" class="space-y-3" enctype="multipart/form-data">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Faza</label>
              <select id="expense-phase" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="" disabled selected>Izaberite fazu...</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Dobavljač / Majstor (opciono)</label>
              <select id="expense-vendor" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">Bez dobavljača</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Opis Stavke</label>
              <input id="expense-title" type="text" placeholder="npr. Armaturna mreža Q335" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Iznos (€)</label>
              <input id="expense-amount" type="number" step="0.01" placeholder="0.00" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Prilog / Račun (Slika ili PDF)</label>
              <input id="expense-file" type="file" accept="image/*,application/pdf" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs text-slate-600 focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50" />
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg text-sm transition mt-2">
              Sačuvaj Trošak
            </button>
          </form>
        </div>

        <!-- Forma za dodavanje dobavljača / majstora -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-base font-bold text-slate-900 mb-3">Dodaj Majstora / Dobavljača</h2>
          <form id="vendor-form" class="space-y-3">
            <div>
              <input id="vendor-name" type="text" placeholder="Naziv / Ime (npr. Stovarište Opeka)" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
            </div>
            <div>
              <input id="vendor-contact" type="text" placeholder="Kontakt telefon / Email" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
            </div>
            <button type="submit" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-2 rounded-lg text-sm transition border border-slate-300">
              + Sačuvaj Dobavljača
            </button>
          </form>
        </div>

      </section>

    </main>
  </div>

  <script src="/app.js?v=3" defer></script>
</body>
</html>
