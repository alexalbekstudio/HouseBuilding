version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: housebuilding_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-housebuilding}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: housebuilding_app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-housebuilding}?schema=public
      PORT: 3000
    volumes:
      - uploads_data:/app/public/uploads
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data: