version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: housebuilding_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: housebuilding
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: housebuilding_api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/housebuilding?schema=public
      - PORT=3000
    depends_on:
      - postgres

volumes:
  pgdata: